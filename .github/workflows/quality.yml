name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-placeholder
      COURSEFORGE_JWT_SECRET: ci-jwt-secret-with-sufficient-entropy-placeholder
      BACKGROUND_FUNCTION_SECRET: ci-background-secret-with-sufficient-entropy-placeholder
      SOFLIA_INBOX_SUPABASE_URL: https://example.supabase.co
      SOFLIA_INBOX_SUPABASE_KEY: ci-inbox-placeholder
      SOFLIA_AUTH_SUPABASE_ANON_KEY: ci-auth-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verificar arnés de desarrollo
        run: npm run verify:harness
      - run: npm run compliance:check
      - run: npm run verify
      - name: Verificar agrupaciones anidadas
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run test:composition-nested-groups
      - name: Verificar guards y copia narrativa en PostgreSQL aislado
        run: |
          npm install --prefix .tmp/sql-verification --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
          npm run test:composition-nested-groups:sql
      - name: Verificar flujo de agrupaciones en Chromium
        working-directory: apps/web
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node .tmp/hyperframes-tests/domains/production/composition-editor/qa/run-composition-nested-groups-smoke.js
      - name: Verify composition preview/render conformance
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run qa:composition-conformance:ci
      - name: Verify composition command palette interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run qa:composition-command-palette
      - name: Verify audio waveform interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run qa:composition-waveform
      - name: Verify media replacement interactions
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run qa:composition-media-replacement
      - name: Upload composition conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composition-conformance
          path: |
            apps/web/.tmp/composition-conformance/conformance-report.json
            apps/web/.tmp/composition-conformance/captures
          if-no-files-found: ignore
          retention-days: 7
      - run: node apps/api/native/rnnoise/test/test-adapter.mjs
      - run: node scripts/verify-rnnoise-artifacts.test.mjs
      - run: node scripts/verify-deepfilter-artifacts.test.mjs
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
