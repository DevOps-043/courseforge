[build]
  command = "node scripts/capture-background-deployment.mjs && npm run build -w apps/web"
  publish = "apps/web/.next"

[build.environment]
  # El worker de TypeScript supera el heap automático de ~2 GiB en este monorepo.
  # Este máximo es por proceso; no modifica la memoria de las Functions.
  NODE_OPTIONS = "--max-old-space-size=4096"

[dev]
  command = "npm run dev -w apps/web"
  framework = "next"
  targetPort = 3000

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "apps/web/netlify/functions"
  # Cargar variables de entorno para funciones en desarrollo
  [functions.environment]
    # Las variables sensibles se cargan desde .env.local automáticamente
    # pero las funciones background a veces no las leen correctamente

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

